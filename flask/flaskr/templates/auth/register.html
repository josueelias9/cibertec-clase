{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto">

    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold mb-3">
            🔐 Iniciar Sesión
        </h1>

        <p class="text-gray-400">
            Accede a tu cuenta para gestionar tus entradas.
        </p>
    </div>

    <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-8 border border-white/10 shadow-2xl">

        <form method="post" class="space-y-6">

            <div>
                <label for="username" class="block mb-2 font-medium text-gray-200">
                    Nombre de Usuario
                </label>

                <input type="text" id="username" name="username" required
                    class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Tu nombre de usuario">
            </div>

            <div>
                <label for="password" class="block mb-2 font-medium text-gray-200">
                    Contraseña
                </label>

                <input type="password" id="password" name="password" required
                    class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Tu contraseña">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 py-4 rounded-xl font-semibold text-lg transition shadow-lg">
                Iniciar Sesión 🚀
            </button>
        </form>
    </div>
</div>
{% endblock %}
