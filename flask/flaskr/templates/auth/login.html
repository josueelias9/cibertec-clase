{% extends "base.html" %}

{% block content %}
<h1 class="text-3xl font-bold mb-6">Iniciar sesión</h1>
<form method="post" class="space-y-4">
    <div>
        <label for="username" class="block text-sm font-medium text-gray-300">Nombre de usuario</label>
        <input type="text" name="username" id="username"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
    </div>
    <div>
        <label for="password" class="block text-sm font-medium text-gray-300">Contraseña</label>
        <input type="password" name="password" id="password"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
    </div>
    <div>
        <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition">Iniciar
            sesión</button>
    </div>
</form>
{% endblock %}
