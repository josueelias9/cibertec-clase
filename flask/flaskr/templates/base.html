<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            min-height: 100vh;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white/10 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="text-2xl font-bold text-indigo-400">
                    ✨ Mi Blog
                </a>

                <div class="flex gap-4">
                    <a href="/auth/register" class="px-4 py-2 rounded-lg hover:bg-white/10 transition">
                        Registrarse
                    </a>
                    <a href="/blog/index" class="px-4 py-2 rounded-lg hover:bg-white/10 transition">
                        Blog
                    </a>

                    <a href="/blog/create" class="px-4 py-2 rounded-lg hover:bg-white/10 transition">
                        Nueva entrada
                    </a>
                    <a href="/auth/login" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg transition">
                        Iniciar sesión
                    </a>
                </div>
            </div>
        </div>
    </nav>

    {% for message in get_flashed_messages() %}
    <div class="mb-4 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-red-300">{{ message }}</div>
    {% endfor %}


    <!-- Contenido -->
    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-12">
        {% block content %}
        {% endblock %}
    </main>
    <!-- Footer -->
    <footer class="border-t border-white/10 bg-black/20 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-6 py-6 text-center text-gray-400">
            © 2026 Mi Blog. Todos los derechos reservados.
        </div>
    </footer>

</body>

</html>
