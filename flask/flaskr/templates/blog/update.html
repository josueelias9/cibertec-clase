{% extends "base.html" %}

{% block content %}
<div class="text-center mb-12">
    <h1 class="text-5xl font-extrabold mb-4">
        ✏️ Editar Entrada
    </h1>

    <p class="text-gray-300 text-lg">
        Modifica los detalles de tu entrada aquí.
    </p>

    <form method="post"
        class="mt-8 max-w-lg mx-auto bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-xl border border-white/10">
        <div class="mb-4">
            <label for="title" class="block text-sm font-medium text-gray-300 mb-1">Título</label>
            <input type="text" name="title" id="title" value="{{ post['title'] }}"
                class="w-full px-4 py-2 rounded-lg bg-white/20 border border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div class="mb-4">
            <label for="body" class="block text-sm font-medium text-gray-300 mb-1">Contenido</label>
            <textarea name="body" id="body" rows="6"
                class="w-full px-4 py-2 rounded-lg bg-white/20 border border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">{{ post['body'] }}</textarea>
        </div>

        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg transition">
            Guardar Cambios
        </button>
    </form>
    <form class="mt-4" action="{{ url_for('blog.delete', id=post['id']) }}" method="post">
        <input class="danger bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition" type="submit" value="Delete"
            onclick="return confirm('Are you sure?');">
    </form>
</div>
{% endblock %}
