<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Page Title</title>
  <link rel='stylesheet' href='main.css'>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

  <!-- Header -->
  <header class="bg-white shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

      <h1 class="text-2xl font-bold text-blue-600">
        MiBlog
      </h1>

      <nav class="space-x-6">
        <a href="/" class="text-gray-700 hover:text-blue-600 transition">
          Inicio
        </a>

        <a href="/blog/index" class="text-gray-700 hover:text-blue-600 transition">
          Ver Blog
        </a>
        <a href="/blog/create" class="text-gray-700 hover:text-blue-600 transition">
          Crear Blog
        </a>

      </nav>

    </div>
  </header>
  <br /><br />

  {% block content %}
  {% endblock %}

  <br /><br /><br /><br /><br /><br /><br /><br />

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-300">
    <div class="max-w-6xl mx-auto px-6 py-6 flex flex-col md:flex-row justify-between items-center">

      <p class="text-sm">
        © 2026 MiSitio. Todos los derechos reservados.
      </p>

      <div class="flex space-x-4 mt-4 md:mt-0">
        <a href="#" class="hover:text-white transition">
          Facebook
        </a>

        <a href="#" class="hover:text-white transition">
          GitHub
        </a>

        <a href="#" class="hover:text-white transition">
          LinkedIn
        </a>
      </div>

    </div>
  </footer>

</body>

</html>
