{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-8">

        <h1 class="text-3xl font-bold text-gray-800 mb-6">
            Editar Post
        </h1>

        <form method="post" class="space-y-6">

            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                    Título
                </label>

                <input type="text" id="title" name="title" value="{{ post.title }}" class="w-full px-4 py-3 border border-gray-300 rounded-xl 
                           focus:outline-none focus:ring-2 focus:ring-blue-500 
                           focus:border-blue-500 transition duration-200" placeholder="Ingresa el título">
            </div>

            <div>
                <label for="body" class="block text-sm font-medium text-gray-700 mb-2">
                    Contenido
                </label>

                <textarea id="body" name="body" rows="6" class="w-full px-4 py-3 border border-gray-300 rounded-xl 
                           focus:outline-none focus:ring-2 focus:ring-blue-500 
                           focus:border-blue-500 transition duration-200 resize-none"
                    placeholder="Escribe el contenido aquí...">{{ post.body }}</textarea>
            </div>

            <div class="flex justify-end gap-3">
                <a href="/" class="px-5 py-3 rounded-xl bg-gray-200 text-gray-700 
                           hover:bg-gray-300 transition duration-200">
                    Cancelar
                </a>

                <button type="submit" class="px-6 py-3 rounded-xl bg-blue-600 text-white 
                           hover:bg-blue-700 shadow-md hover:shadow-lg 
                           transition duration-200">
                    Actualizar
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
