{% extends "base.html" %}

{% block content %}
<form method="post" class="bg-white p-8 rounded-2xl shadow-xl max-w-lg mx-auto space-y-6">

    <div>
        <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">
            Título
        </label>

        <input type="text" id="title" name="title" required
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Escribe el título del blog">
    </div>

    <div>
        <label for="content" class="block text-sm font-semibold text-gray-700 mb-2">
            Contenido
        </label>

        <textarea id="content" name="content" required rows="6"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Escribe el contenido aquí..."></textarea>
    </div>

    <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition duration-200">
        Crear
    </button>

</form>
{% endblock %}
