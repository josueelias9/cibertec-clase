{% extends "base.html" %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold mb-3">
            ✍️ Crear Nueva Entrada
        </h1>

        <p class="text-gray-400">
            Comparte tus ideas con el mundo.
        </p>
    </div>

    <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-8 border border-white/10 shadow-2xl">

        <form method="post" class="space-y-6">

            <div>
                <label
                    for="title"
                    class="block mb-2 font-medium text-gray-200">
                    Título
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                    class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Ej: Mi primer post"
                >
            </div>

            <div>
                <label
                    for="body"
                    class="block mb-2 font-medium text-gray-200">
                    Contenido
                </label>

                <textarea
                    id="body"
                    name="body"
                    rows="8"
                    required
                    class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Escribe aquí tu contenido..."
                ></textarea>
            </div>

            <button
                type="submit"
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 py-4 rounded-xl font-semibold text-lg transition shadow-lg">
                Publicar Entrada 🚀
            </button>

        </form>

    </div>

</div>

{% endblock %}
