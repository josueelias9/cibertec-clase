{% extends "base.html" %}


{% block content %}


{% for post in posts %}
<div class="bg-white shadow-md rounded-lg p-6 mt-6">
  <h2 class="text-2xl font-semibold text-gray-800">
    {{ post["id"] }} - {{ post["title"] }}
  </h2>
  <p class="text-gray-600 mt-2">
    {{ post["body"] }}
  </p>
</div>
{% endfor %}


{% endblock %}
