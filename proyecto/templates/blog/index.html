{% extends "base.html" %}

{% block content %}

<div class="text-center mb-12">
    <h1 class="text-5xl font-extrabold mb-4">
        🚀 Bienvenido al Blog
    </h1>

    <p class="text-gray-300 text-lg">
        Comparte ideas, aprende y construye cosas increíbles.
    </p>
</div>

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">

    {% for post in posts %}
    <article
        class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-xl border border-white/10 hover:scale-105 hover:shadow-2xl transition duration-300">

        <div class="flex items-center gap-2 mb-4">
            <span class="bg-indigo-600 px-3 py-1 rounded-full text-sm">
                Post #{{ post['id'] }}
            </span>
        </div>

        <h2 class="text-2xl font-bold mb-3 text-indigo-300">
            {{ post['title'] }}
        </h2>

        <p class="text-gray-300 line-clamp-4">
            {{ post['body'] }}
        </p>

        <div class="mt-6">
            <button class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg transition">
                <a class="action" href="{{ url_for('blog.update', id=post['id']) }}">Ver</a>
            </button>
        </div>
    </article>
    {% endfor %}

</div>

{% endblock %}
